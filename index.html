<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny - Chúc mừng 20/10</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Courier New', Courier, monospace;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    /* Bầu trời sao nền lung linh */
    #tiny-sky {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.6s ease-in-out, visibility 1.6s;
    }
    #tiny-sky.hien-thi {
      opacity: 1;
      visibility: visible;
    }
    .tiny-star {
      position: absolute;
      width: var(--size);
      height: var(--size);
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px 1px rgba(220, 244, 255, .65);
      animation: tinyTwinkle var(--twinkle) ease-in-out var(--delay) infinite alternate;
    }
    @keyframes tinyTwinkle {
      from { opacity: .18; transform: scale(.65); }
      to { opacity: .95; transform: scale(1.25); }
    }

    /* Sao băng */
    .tiny-meteor {
      position: absolute;
      width: 100px;
      height: 2px;
      opacity: 0;
      background: linear-gradient(to right, rgba(255,255,255,.98) 0%, rgba(130,200,255,0) 100%);
      transform: rotate(-25deg);
      animation: tinyMeteor 4s linear infinite;
    }
    @keyframes tinyMeteor {
      0% { opacity: 0; transform: translate(0, 0) rotate(-25deg); }
      20% { opacity: 1; }
      40% { opacity: 0; transform: translate(-300px, 300px) rotate(-25deg); }
      100% { opacity: 0; }
    }

    /* HỆ THỐNG NỀN CHUYỂN MÀU NỀN MƯỢT MÀ */
    .bg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      transition: opacity 2s ease-in-out;
    }

    /* LỚP PHỦ MƯA ICON ĐẰNG SAU */
    #floating-icons-bg {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }
    .floating-icon {
      position: absolute;
      font-size: var(--icon-size);
      opacity: 0;
      animation: floatRandomvar var(--float-duration) ease-in-out infinite var(--float-delay);
      user-select: none;
    }
    @keyframes floatRandomvar {
      0% {
        transform: translate(0, 0) scale(0.6) rotate(0deg);
        opacity: 0;
      }
      25% {
        opacity: var(--icon-opacity);
      }
      50% {
        transform: translate(var(--move-x), var(--move-y)) scale(1.1) rotate(180deg);
        opacity: var(--icon-opacity);
      }
      75% {
        opacity: var(--icon-opacity);
      }
      100% {
        transform: translate(calc(var(--move-x) * 1.5), calc(var(--move-y) * 1.5)) scale(0.7) rotate(360deg);
        opacity: 0;
      }
    }

    /* Ảnh nền minh họa góc phải */
    #bg-image-container {
      position: absolute;
      bottom: 0;
      right: 2vw;
      height: 80vh;
      width: 45vw;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.2s ease-in-out, transform 1.2s ease-out;
    }
    #bg-image-container.hien-thi {
      opacity: 1;
      transform: translateY(0);
    }
    #bg-image-aura {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 180, 220, 0.45) 0%, rgba(0, 243, 255, 0.2) 50%, rgba(0,0,0,0) 75%);
      filter: blur(25px);
      animation: auraGlow 3s infinite alternate ease-in-out;
    }
    #bg-image {
      position: relative;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: bottom right;
      z-index: 2;
      filter: drop-shadow(0 0 15px rgba(255, 200, 255, 0.6));
    }

    /* MÁY BAY BAY NGANG MÀN HÌNH */
    #airplane-container {
      position: absolute;
      z-index: 25;
      font-size: 80px;
      pointer-events: none;
      opacity: 0;
    }
    #airplane-container.fly-pass-1 {
      animation: flyHorizontalLeftToRight 2.2s forwards linear;
    }
    #airplane-container.fly-pass-2 {
      animation: flyHorizontalRightToLeft 2.2s forwards linear;
    }
    #airplane-container.fly-drop {
      animation: flyHorizontalLeftToRight 2.5s forwards linear;
    }

    @keyframes flyHorizontalLeftToRight {
      0% { opacity: 1; transform: translate(-150px, 0) scale(0.8) rotate(0deg); }
      50% { opacity: 1; transform: translate(50vw, 0px) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate(110vw, 0px) scale(1.1) rotate(0deg); }
    }

    @keyframes flyHorizontalRightToLeft {
      0% { opacity: 1; transform: translate(110vw, 0) scale(0.8) rotate(180deg); }
      50% { opacity: 1; transform: translate(50vw, 0px) scale(1) rotate(180deg); }
      100% { opacity: 0; transform: translate(-150px, 0px) scale(1.1) rotate(180deg); }
    }

    /* KHUNG VIỀN LED XANH CHỨA ẢNH TỔNG HỢP */
    #class-photo-container {
      position: absolute;
      z-index: 30;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.1);
      width: 86vw;
      height: 76vh;
      max-width: 1100px;
      max-height: 640px;
      background: rgba(8, 8, 16, 0.98);
      border: 3px solid #00f3ff;
      border-radius: 16px;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.85), inset 0 0 20px rgba(0, 243, 255, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transition: none;
    }
    #class-photo-container.hien-thi {
      opacity: 1;
      visibility: visible;
      animation: dropAndZoomIn 1.2s forwards cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes dropAndZoomIn {
      0% {
        transform: translate(-50%, -120vh) scale(0.1) rotate(-8deg);
        opacity: 0;
      }
      60% {
        opacity: 1;
        transform: translate(-50%, -49%) scale(1.03) rotate(2deg);
      }
      100% {
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    /* TIÊU ĐỀ PHÍA TRÊN */
    .photo-title-banner {
      width: 100%;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #00f3ff;
      text-shadow: 0 0 10px #00f3ff, 0 0 20px rgba(255,0,127,0.7);
      margin-bottom: 8px;
      letter-spacing: 2px;
      animation: bannerGlow 1.5s infinite alternate ease-in-out;
    }
    @keyframes bannerGlow {
      from { opacity: 0.8; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1.02); }
    }

    /* KHUNG HIỂN THỊ TRỌN VẸN ẢNH TỔNG HỢP */
    .single-photo-wrapper {
      position: relative;
      width: 100%;
      height: calc(100% - 35px);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(0, 243, 255, 0.4);
      background-color: #05050a;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .single-photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      transition: transform 0.4s ease;
    }
    .single-photo-wrapper:hover img {
      transform: scale(1.02);
    }

    /* BIỂU TƯỢNG TRUNG TÂM PHÁT SÁNG (AURA) */
    .element-wrapper {
      position: absolute;
      transform: translate(-50%, -50%) scale(0.8);
      width: 180px;
      height: 180px;
      opacity: 0;
      transition: opacity 0.6s ease-in-out, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.6s ease-in-out, left 0.6s ease-in-out;
      z-index: 6;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .element-wrapper.hien-thi {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .element-wrapper.fade-out {
      opacity: 0 !important;
      transform: translate(-50%, -50%) scale(0.7) !important;
    }

    .aura-clover {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.65) 0%, rgba(0, 180, 80, 0.25) 55%, rgba(0,0,0,0) 75%);
      filter: blur(20px); animation: auraPulse 2s infinite alternate ease-in-out;
    }
    .aura-star {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 220, 0, 0.7) 0%, rgba(255, 140, 0, 0.3) 55%, rgba(0,0,0,0) 75%);
      filter: blur(22px); animation: auraRotate 4s infinite linear;
    }
    .aura-heart {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 50, 120, 0.75) 0%, rgba(200, 0, 80, 0.3) 55%, rgba(0,0,0,0) 75%);
      filter: blur(20px); animation: auraHeartbeat 1.2s infinite alternate ease-in-out;
    }
    .aura-flower {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 150, 200, 0.7) 0%, rgba(180, 80, 220, 0.3) 55%, rgba(0,0,0,0) 75%);
      filter: blur(22px); animation: auraPulse 2.5s infinite alternate ease-in-out;
    }
    .aura-gold {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.8) 0%, rgba(255, 165, 0, 0.35) 55%, rgba(0,0,0,0) 75%);
      filter: blur(22px); animation: auraPulse 1.8s infinite alternate ease-in-out;
    }
    .aura-rainbow {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.6) 0%, rgba(255, 0, 128, 0.4) 50%, rgba(0,0,0,0) 75%);
      filter: blur(25px); animation: auraRotate 3s infinite linear;
    }
    .aura-purple {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle, rgba(180, 80, 255, 0.75) 0%, rgba(100, 0, 200, 0.3) 55%, rgba(0,0,0,0) 75%);
      filter: blur(20px); animation: auraPulse 2s infinite alternate ease-in-out;
    }

    @keyframes auraPulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes auraRotate {
      0% { transform: rotate(0deg) scale(0.95); opacity: 0.8; }
      50% { transform: rotate(180deg) scale(1.1); opacity: 1; }
      100% { transform: rotate(360deg) scale(0.95); opacity: 0.8; }
    }
    @keyframes auraHeartbeat {
      0% { transform: scale(0.88); opacity: 0.75; }
      100% { transform: scale(1.18); opacity: 1; }
    }
    @keyframes auraGlow {
      0% { opacity: 0.6; transform: scale(0.95); }
      100% { opacity: 0.95; transform: scale(1.05); }
    }

    .custom-icon {
      position: relative;
      font-size: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      user-select: none;
    }

    .bounce-icon {
      animation: iconBounce 1.5s infinite ease-in-out;
    }
    @keyframes iconBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.08); }
    }

    #big-clover {
      position: relative;
      width: 140px;
      height: 140px;
      z-index: 2;
    }
    .clover-leaf {
      position: absolute;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #00ff88, #00cc55);
      border-radius: 50% 50% 20% 50%;
      box-shadow: 0 0 25px rgba(0, 255, 128, 0.9);
    }
    .clover-leaf:nth-child(1) { top: 8px; left: 38px; transform: rotate(-45deg); }
    .clover-leaf:nth-child(2) { top: 38px; left: 68px; transform: rotate(45deg); }
    .clover-leaf:nth-child(3) { top: 68px; left: 38px; transform: rotate(135deg); }
    .clover-leaf:nth-child(4) { top: 38px; left: 8px; transform: rotate(225deg); }
    .clover-stem {
      position: absolute;
      bottom: -2px;
      left: 65px;
      width: 5px;
      height: 45px;
      background: #00aa44;
      border-radius: 4px;
    }

    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      height: 100%;
    }

    .text-box {
      position: absolute;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 30px rgba(0, 243, 255, 0.6);
      max-width: 480px;
      line-height: 1.5;
      padding: 0 15px;
      z-index: 10;
      transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .text-box.zoom-center {
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) scale(1.4) !important;
      max-width: 750px;
      text-align: center;
      font-size: 28px;
      text-shadow: 0 0 25px rgba(255, 119, 170, 0.9), 0 0 50px rgba(0, 243, 255, 0.8);
    }

    .hint {
      position: absolute;
      bottom: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.4);
      z-index: 20;
      pointer-events: none;
    }

    .face-container {
      display: flex;
      gap: 30px;
      position: absolute;
      align-items: center;
      justify-content: center;
      height: 150px;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 5;
    }

    /* ĐÔI MẮT MÀU GRADIENT PHA TRỘN MƯỢT MÀ */
    .eye {
      width: 150px;
      height: 150px;
      background: linear-gradient(135deg, #ff007f 0%, #7928ca 35%, #00dfd8 100%);
      border-radius: 40px;
      box-shadow: 0 0 40px rgba(255, 0, 127, 0.5), 0 0 80px rgba(0, 223, 216, 0.4), inset 0 0 35px rgba(255, 255, 255, 0.85);
      transition: background 1.5s ease-in-out, box-shadow 1.5s ease-in-out, width 0.4s ease, height 0.4s ease, border-radius 0.4s ease, transform 0.3s ease;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    .blush {
      position: absolute;
      bottom: -26px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      font-size: 22px;
      font-weight: 900;
      color: #ff4d88;
      text-shadow: 0 0 10px #ff3377, 0 0 20px #ff3377;
      letter-spacing: 6px;
      font-family: Arial, sans-serif;
      user-select: none;
      animation: blushGlow 0.8s infinite alternate ease-in-out;
    }

    @keyframes blushGlow {
      0% { opacity: 0.7; transform: translateX(-50%) scale(0.95); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
    }

    .eye.shy-animation {
      animation: shyShake 1s infinite ease-in-out;
    }

    @keyframes shyShake {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(4px) rotate(-4deg); }
      75% { transform: translateY(-3px) rotate(4deg); }
    }

    .eye.blink {
      height: 12px !important;
      border-radius: 6px !important;
      box-shadow: 0 0 20px currentcolor;
    }

    /* TRẠNG THÁI MẮT GRADIENT CỰC RỰC RỠ */
    .eye.happy {
      height: 110px;
      border-radius: 55px 55px 25px 25px;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 50%, #00ffaa 100%);
      box-shadow: 0 0 45px rgba(0, 198, 255, 0.6), inset 0 0 35px rgba(255, 255, 255, 0.85);
    }

    .eye.blush-state {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #ff007f 100%);
      box-shadow: 0 0 45px rgba(255, 117, 140, 0.6), inset 0 0 35px rgba(255, 255, 255, 0.85);
    }

    .eye.star {
      background: linear-gradient(135deg, #f7ff00 0%, #db36a4 50%, #7928ca 100%);
      box-shadow: 0 0 45px rgba(247, 255, 0, 0.6), inset 0 0 35px rgba(255, 255, 255, 0.85);
    }
    .eye.star::after {
      content: '★';
      font-size: 80px;
      color: #ffffff;
      text-shadow: 0 0 20px #ffffff, 0 0 40px #ffffff;
      animation: starSpin 3s infinite linear;
    }
    @keyframes starSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.12); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .eye.heart {
      background: linear-gradient(135deg, #ff0844 0%, #ffb199 50%, #ff3366 100%);
      box-shadow: 0 0 45px rgba(255, 8, 68, 0.6), inset 0 0 35px rgba(255, 255, 255, 0.85);
    }
    .eye.heart::after {
      content: '❤️';
      font-size: 70px;
      animation: heartBeat 0.8s infinite alternate ease-in-out;
    }
    @keyframes heartBeat {
      0% { transform: scale(0.9); }
      100% { transform: scale(1.18); }
    }

    .eye.wink-left {
      height: 90px;
      border-radius: 65px 65px 16px 16px;
      background: linear-gradient(135deg, #b224ef 0%, #7579ff 50%, #00d2ff 100%);
      box-shadow: 0 0 45px rgba(178, 36, 239, 0.6), inset 0 0 35px rgba(255, 255, 255, 0.85);
    }

    .eye.surprised {
      width: 165px;
      height: 165px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f12711 0%, #f5af19 50%, #ff007f 100%);
      box-shadow: 0 0 50px rgba(241, 39, 17, 0.7), inset 0 0 35px rgba(255, 255, 255, 0.9);
    }

    .eye.dizzy {
      background: linear-gradient(135deg, #4e54c8 0%, #8f94fb 50%, #ff007f 100%);
      box-shadow: 0 0 45px rgba(78, 84, 200, 0.6), inset 0 0 35px rgba(255, 255, 255, 0.85);
    }
    .eye.dizzy::after {
      content: '🌀';
      font-size: 75px;
      animation: dizzySpin 1.5s infinite linear;
    }
    @keyframes dizzySpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .eye.sparkle {
      background: linear-gradient(135deg, #ffe000 0%, #799f0c 50%, #00dfd8 100%);
      box-shadow: 0 0 45px rgba(255, 224, 0, 0.6), inset 0 0 35px rgba(255, 255, 255, 0.85);
    }
    .eye.sparkle::after {
      content: '✨';
      font-size: 75px;
      animation: sparkleGlow 1s infinite alternate ease-in-out;
    }
    @keyframes sparkleGlow {
      0% { transform: scale(0.8); opacity: 0.6; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .eye.cool {
      background: linear-gradient(135deg, #0ba360 0%, #3cba92 50%, #00f2fe 100%);
      box-shadow: 0 0 45px rgba(11, 163, 96, 0.6), inset 0 0 35px rgba(255, 255, 255, 0.85);
    }
    .eye.cool::after {
      content: '🕶️';
      font-size: 85px;
    }

    .eye.fire {
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 50%, #f7b733 100%);
      box-shadow: 0 0 45px rgba(255, 65, 108, 0.6), inset 0 0 35px rgba(255, 255, 255, 0.85);
    }
    .eye.fire::after {
      content: '🔥';
      font-size: 75px;
      animation: fireFlicker 0.6s infinite alternate ease-in-out;
    }
    @keyframes fireFlicker {
      0% { transform: scale(0.9) translateY(0); }
      100% { transform: scale(1.15) translateY(-5px); }
    }

    #start-btn {
      position: absolute;
      z-index: 100;
      padding: 16px 34px;
      font-size: 20px;
      background-color: #00f3ff;
      color: #000;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 20px #00f3ff;
      transition: transform 0.2s;
    }

    #start-btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <button id="start-btn">Nhấn vào đây để xem ❤️</button>

  <div id="tiny-sky"></div>
  <div id="floating-icons-bg"></div>
  
  <div id="bg-layer-1" class="bg-layer" style="opacity: 1;"></div>
  <div id="bg-layer-2" class="bg-layer" style="opacity: 0;"></div>
  
  <div id="bg-image-container">
    <div id="bg-image-aura"></div>
    <div id="bg-image"></div>
  </div>
  
  <div class="element-wrapper" id="dynamic-element-wrapper">
    <div id="dynamic-aura" class="aura-clover"></div>
    <div id="dynamic-content"></div>
  </div>

  <!-- MÁY BAY CHUYỂN ĐỘNG -->
  <div id="airplane-container">✈️</div>

  <!-- KHUNG ẢNH CHỨA 1 ẢNH TỔNG HỢP VỚI TIÊU ĐỀ TẬP THỂ 9.11 MÃI ĐỈNH -->
  <div id="class-photo-container">
    <div class="photo-title-banner">✨ TẬP THỂ 9.11 MÃI ĐỈNH ✨</div>
    <div class="single-photo-wrapper">
      <img src="anh1.png" alt="Ảnh tập thể 9.11">
    </div>
  </div>

  <div class="container" id="main-content" style="display: none;">
    <div class="text-box" id="text-display"></div>
    
    <div class="face-container" id="face-container">
      <div class="eye left" id="eye-left">
        <div class="blush" id="blush-left">////</div>

    let hasBlinkedThisSentence = false;

    function typeWriter(text, index = 0, speed = 32, cb) {
      if (index === 0) {
        textDisplay.innerHTML = "";
        hasBlinkedThisSentence = false;
      }
      
      const midPoint = Math.floor(text.length / 2);
      if (!hasBlinkedThisSentence && index === midPoint && text.length > 5) {
        hasBlinkedThisSentence = true;
        triggerBlink();
      }

      if (index < text.length) {
        textDisplay.innerHTML = text.substring(0, index + 1);
        setTimeout(() => typeWriter(text, index + 1, speed, cb), speed);
      } else if (cb) {
        cb();
      }
    }

    function updateDynamicElement(newType) {
      if (!newType) {
        dynamicElementWrapper.classList.remove('hien-thi');
        currentElementType = "";
        return;
      }

      if (currentElementType && currentElementType !== newType) {
        dynamicElementWrapper.classList.add('fade-out');
        setTimeout(() => {
          buildElementHTML(newType);
          dynamicElementWrapper.classList.remove('fade-out');
          dynamicElementWrapper.classList.add('hien-thi');
          currentElementType = newType;
        }, 300);
      } else {
        buildElementHTML(newType);
        dynamicElementWrapper.classList.add('hien-thi');
        currentElementType = newType;
      }
    }

    function showStep() {
      if (currentStep >= script.length) {
        return;
      }

      isAnimating = true;
      const step = script[currentStep];
      
      transitionBgColor(step.bg);
      spawnFloatingIcons(step.iconTheme || "default", step.pos);

      if (step.showSky) {
        skyContainer.classList.add('hien-thi');
      } else {
        skyContainer.classList.remove('hien-thi');
      }

      if (step.img) {
        bgImage.style.backgroundImage = `url('${step.img}')`;
        bgImageContainer.classList.add('hien-thi');
      } else {
        bgImageContainer.classList.remove('hien-thi');
      }

      airplaneContainer.className = "";

      if (step.flyPass === 1) {
        airplaneContainer.style.top = "50%";
        airplaneContainer.classList.add('fly-pass-1');
      } else if (step.flyPass === 2) {
        airplaneContainer.style.top = "50%";
        airplaneContainer.classList.add('fly-pass-2');
      }

      if (step.dropPhoto) {
        faceContainer.style.opacity = '0';
        updateDynamicElement(null);
        textDisplay.style.opacity = '0';
        hintText.style.display = 'none';
        airplaneContainer.style.top = "50%";
        airplaneContainer.classList.add('fly-drop');
        setTimeout(() => {
          classPhotoContainer.classList.add('hien-thi');
        }, 800);
      } else {
        faceContainer.style.opacity = '1';
        updateLayout(step.pos, !!step.showElement, step.zoomCenter);
        updateDynamicElement(step.showElement);
      }

      textDisplay.style.opacity = '1';
      textDisplay.innerHTML = "";
      
      handleAudioManagement(step.track);

      // Thiết lập tốc độ: Phần 1 (32ms), Phần 2 (60ms)
      const typingSpeed = (step.track === 2) ? 60 : 32;

      dynamicEyeTransition(step.eyeState, () => {
        typeWriter(step.text, 0, typingSpeed, () => {
          isAnimating = false;
        });
      });
    }

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startBtn.style.display = 'none';
      mainContent.style.display = 'flex';
      hintText.style.display = 'block';
      
      bgLayer1.style.background = script[0].bg;
      showStep();
    });

    document.body.addEventListener('click', () => {
      if (mainContent.style.display === 'flex' && !isAnimating && currentStep < script.length - 1) {
        currentStep++;
        showStep();
      }
    });
  </script>
